# Weekly: evaluate the triage tool on recently merged opam-repository PRs
# (evaluate-closed-prs), compare with the previous week, and
# keep the history on the `accuracy` branch. The job fails, and GitHub
# notifies, when a suggestion that matched an author's fix last week no
# longer does, or when precision drops sharply.
name: Accuracy

on:
  schedule:
    - cron: "17 5 * * 1"      # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write              # push the history to the `accuracy` branch

concurrency:
  group: accuracy
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The tools (OCaml), prebuilt by the Build workflow for this commit.
      - uses: ./.github/actions/tools

      # The triage page's cache: most CI pages and logs are already there.
      - name: Restore the tool's cache
        uses: actions/cache/restore@v6
        with:
          path: .opam-ci-cache
          key: accuracy-${{ github.run_id }}
          restore-keys: triage-

      - name: Fetch the history
        run: |
          if git fetch --depth=1 origin accuracy; then
            git worktree add -B accuracy history FETCH_HEAD
          else
            git worktree add --orphan -b accuracy history
          fi

      - name: Evaluate on the PRs merged in the last 90 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          evaluate-closed-prs --since "$(date -d '90 days ago' +%F)" --limit 150 \
            --json eval.json > eval.txt
          tail -3 eval.txt

      - name: Compare with the previous run
        id: compare
        run: |
          set +e
          accuracy-report eval.json --history history --commit "$GITHUB_SHA" > report.md
          status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cp eval.txt history/latest.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Save the history on the accuracy branch
        run: |
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl latest.json latest.txt
          git commit -q -m "Accuracy on $(date +%F) (tool ${GITHUB_SHA::12})" || exit 0
          git push -q origin HEAD:accuracy

      - name: Fail on a regression
        if: steps.compare.outputs.status != '0'
        run: |
          echo "::error::the triage tool got worse on merged PRs; see the job summary"
          exit 1
