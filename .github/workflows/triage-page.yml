# Hourly: run `opam-ci-triage suggest` on the open ocaml/opam-repository
# PRs whose opam-ci status is `failure`, and publish the results on GitHub Pages.
# Enable: Settings -> Pages -> Source: GitHub Actions, then run it once by hand.
name: Triage page

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: triage-page
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      # Optional: with this repository secret set, failures that no rule
      # recognises get an LLM diagnosis (costs API tokens; at most
      # --llm-budget calls per run, and answers are cached). Without it the
      # page is built from the rules alone.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The tools (OCaml), prebuilt by the Build workflow for this commit.
      - uses: ./.github/actions/tools

      # .opam-ci-cache/: pages, logs and lookups of the tool (finished CI results
      # do not change); state/: per-PR head sha and last result, so unchanged PRs
      # are not analysed again. One cache entry per run, restored from the latest.
      - name: Restore cache and state
        uses: actions/cache/restore@v6
        with:
          path: |
            .opam-ci-cache
            state
          key: triage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: triage-

      # The git mirrors (.opam-ci-cache/git/<hash>/) are pruned whole, by the
      # time of their last use (a file the tool touches): most of their files
      # are never rewritten, and a mirror missing some of them is broken.
      - name: Prune cache entries older than 30 days
        run: |
          if [ -d .opam-ci-cache ]; then
            find .opam-ci-cache -path .opam-ci-cache/git -prune -o -type f -mtime +30 -print0 | xargs -0 -r rm -f
            for d in .opam-ci-cache/git/*/; do
              [ -d "$d" ] || continue
              if [ -z "$(find "$d" -maxdepth 1 -name opam-ci-last-used -mtime -30)" ]; then
                rm -rf "$d"
              fi
            done
            du -sh .opam-ci-cache
          fi

      - name: Analyse failing PRs
        id: triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: triage-open-prs --time-budget 2100 --llm-budget 40

      - name: Save cache and state
        if: always() && steps.triage.outputs.changed != 'false'
        uses: actions/cache/save@v6
        with:
          path: |
            .opam-ci-cache
            state
          key: triage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Render the page
        run: render-page

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
